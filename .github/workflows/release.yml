name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the APK attached
# as open-cowork-android_1-0-0.apk. Can also be re-run by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "apk=open-cowork-android_${VERSION//./-}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Release signing key (optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "key=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with this runner's temporary debug key."
            echo "key=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersionName=${{ steps.version.outputs.version }}

      - name: Prepare APK and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
          KEY: ${{ steps.signing.outputs.key }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES="docs/releases/$VERSION.md"
          { if [ -f "$NOTES" ]; then cat "$NOTES"; else echo "Open Cowork for Android $VERSION"; fi
            echo
            echo "**Download:** \`$APK\` (SHA-256 \`$SHA\`)"
            if [ "$KEY" = "debug" ]; then
              echo
              echo "> This build is signed with a temporary key. If Android later refuses to install an update over it"
              echo "> (\"package conflicts with an existing package\"), uninstall this version first, then install the new one."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" --title "$VERSION" --notes-file release-notes.md --verify-tag
          fi
